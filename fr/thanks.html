<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vous êtes sur la liste — Chofl</title>
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f2efe8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    color: #141414;
  }
  .card {
    text-align: center;
    padding: 0 24px;
    max-width: 480px;
  }
  .check {
    width: 72px;
    height: 72px;
    background: #0e3a2a;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 32px;
  }
  .check svg { width: 36px; height: 36px; }
  h1 {
    font-family: Georgia, "Instrument Serif", serif;
    font-size: clamp(28px, 5vw, 38px);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: #5a5549;
    margin-bottom: 32px;
  }
  a {
    font-size: 13px;
    font-family: "JetBrains Mono", "Courier New", monospace;
    letter-spacing: 0.06em;
    color: #0e3a2a;
    text-decoration: none;
    border-bottom: 1px solid currentColor;
    padding-bottom: 1px;
    transition: opacity .15s ease;
  }
  a:hover { opacity: 0.65; }
</style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 18 L15 25 L28 11" stroke="#f2efe8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Vous êtes sur la liste.</h1>
    <p>Nous vous contacterons dès que Chofl sera prêt pour votre équipe.</p>
    <a href="/fr">← Retour à Chofl</a>
  </div>
</body>
</html>
